on:
  schedule:
    # Runs at 02:07 UTC on Wednesday from September through February
    - cron:  '7 2 * 1,2,9-12 3'
  workflow_dispatch:
    inputs:
      games_to_refresh:
        description: 'Number of latest games to refresh'
        required: false
        default: 16
        type: number

name: REFRESH-RAW-PBP

jobs:
  update:
    name: refresh_raw_pbp
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    permissions:
      contents: read
    env:
      _REFRESH_N_LATEST_GAMES_: ${{ inputs.games_to_refresh || '16' }}
    steps:
      # read-only, for installing the private nflapi package
      - id: read-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi

      # Checkout + nflverse packages at their latest commit + this package
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflapi nflverse/nflverse-data nflverse/nflreadr
          install-local: true
          github-pat: ${{ steps.read-token.outputs.token }}

      # write access to the raw_pbp_<season> releases of nflverse-pbp only.
      # Minted after setup, which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-pbp
          contents: write

      - name: Run raw pbp refresh
        run: Rscript -e 'source("auto/release_raw.R")'
        env:
          # gh cli (release uploads) and gh::gh_token() in release_raw_pbp()
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
          GITHUB_PAT: ${{ steps.upload-token.outputs.token }}
